# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# monitor = HDMI-A-1, 1920x1080@144, 0x0, 1
monitor = , preferred,auto,auto

# ==================
# STARTUP APPS
# ==================
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = br
    numlock_by_default = true
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    layout = dwindle
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 10

    active_opacity = 0.9
    inactive_opacity = 0.8

    blur {
        enabled = true
        size = 4
        passes = 1
    }

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ==================
# WINDOW RULES
# ==================
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = rounding 12, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(org\.gnome\.Calculator)$
windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

windowrule = no_initial_focus on, match:class ^(steam)$, match:title ^(notificationtoasts)
windowrule = pin on, match:class ^(steam)$, match:title ^(notificationtoasts)

windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

# ==================
# LAYOUT PERSON
# =================

windowrule {
    name = fastfetch-overlay
    match:title = ^(fastfetch-overlay)$
    float = on
    size = 1029 393
    move = 63 11
    workspace = 1 silent
    no_initial_focus = on
}

windowrule {
    name = clock-overlay
    match:title = ^(clock-overlay)$
    float = on
    size = 1039 396
    move = 58 669
    workspace = 1 silent
    no_initial_focus = on
}

windowrule {
    name = cava-overlay
    match:title = ^(cava-overlay)$
    float = on
    size = 801 1054
    move = 1105 12
    workspace = 1 silent
    no_initial_focus = on
}

windowrule {
    name = unimatrix-overlay
    match:title = ^(unimatrix-overlay)$
    float = on
    size = 527 244
    move = 565 413
    workspace = 1 silent
    no_initial_focus = on
}

windowrule {
    name = lyrics-overlay
    match:title = ^(lyrics-overlay)$
    float = on
    size = 496 247
    move = 60 412
    workspace = 1 silent
    no_initial_focus = on
}


exec-once = kitty --title fastfetch-overlay --override font_size=9 -e bash -c "while true; do clear; fastfetch; sleep 10; done"
exec-once = kitty --title clock-overlay --override font_size=14 -e tty-clock -scC 5
exec-once = kitty --title cava-overlay -e cava
exec-once = kitty --title unimatrix-overlay --class overlay -e unimatrix -s 90 -c green -b
exec-once = kitty --title lyrics-overlay --class overlay -e lyrics-vis
exec-once = linux-wallpaperengine --screen-root HDMI-A-1 --bg 2913091682

# ==================
# OTHERS
# ==================

# DMS windows floating by defaul
# ! Hyprland doesn't size these windows correctly so disabling by default here
# windowrule = float on, match:class ^(org.quickshell)$

layerrule = no_anim on, match:namespace ^(quickshell)$
layerrule = no_anim on, match:namespace ^dms:.*

source = ./dms/colors.conf
source = ./dms/outputs.conf
source = ./dms/layout.conf
source = ./dms/cursor.conf
source = ./dms/binds.conf

exec-once = sleep 3 && easyeffects --gapplication-service
exec-once = ~/.config/scripts/cava.sh

bind = , F12, exec, hyprshot -m region
bind = $mainMod SHIFT, S, exec, hyprshot -m output   

env = XCURSOR_THEME,KasaneTeto
env = XCURSOR_SIZE,16
env = HYPRCURSOR_THEME,KasaneTeto
env = HYPRCURSOR_SIZE,16	
